<svg width="700" height="140" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Visual Install Guide</title>
<desc>Click to open the step-by-step visual install guide for Waraq.</desc>
<style>
.btn-bg { fill: #1f2326; }
.btn-accent { fill: #c83a4a; }
.btn-text-primary { fill: #f5ecd6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-weight: 700; font-size: 26px; }
.btn-text-secondary { fill: #9a948a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-weight: 400; font-size: 14px; }
.btn-icon-stroke { stroke: #f5ecd6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.btn-arrow { stroke: #f5ecd6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.btn-border { fill: none; stroke: #3a3f44; stroke-width: 1; }
</style>
<rect class="btn-bg" x="0" y="5" width="700" height="130" rx="16"/>
<rect class="btn-border" x="0.5" y="5.5" width="699" height="129" rx="16"/>
<clipPath id="leftAccent">
<rect x="0" y="5" width="700" height="130" rx="16"/>
</clipPath>
<g clip-path="url(#leftAccent)">
<rect class="btn-accent" x="0" y="5" width="6" height="130"/>
</g>
<g transform="translate(45, 40)">
<rect x="4" y="4" width="48" height="60" rx="3" class="btn-icon-stroke"/>
<line x1="4" y1="20" x2="52" y2="20" class="btn-icon-stroke"/>
<line x1="14" y1="34" x2="42" y2="34" class="btn-icon-stroke"/>
<line x1="14" y1="44" x2="42" y2="44" class="btn-icon-stroke"/>
<line x1="14" y1="54" x2="36" y2="54" class="btn-icon-stroke"/>
</g>
<text x="125" y="62" class="btn-text-primary">Visual Install Guide</text>
<text x="125" y="89" class="btn-text-secondary">Step-by-step walkthrough with screenshots and mockups</text>
<g transform="translate(625, 70)">
<circle r="28" class="btn-accent"/>
<path d="M -8 -9 L 6 0 L -8 9" class="btn-arrow"/>
</g>
</svg>

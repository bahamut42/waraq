<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Waraq (ورق) - Live wallpapers for macOS">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2326"/>
      <stop offset="100%" stop-color="#14171a"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes drawLine {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
      font-size: 92px;
      font-weight: 800;
      fill: #f5ecd6;
      letter-spacing: -4px;
      animation: fadeUp 1.2s ease-out;
    }
    .arabic {
      font-family: "Geeza Pro", "SF Arabic", "Noto Naskh Arabic", -apple-system, system-ui, sans-serif;
      font-size: 96px;
      font-weight: 700;
      fill: #c83a4a;
      opacity: 0.92;
      animation: fadeIn 2s ease-out;
    }
    .define {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 18px;
      font-weight: 400;
      fill: #b8b0a2;
      animation: fadeUp 1.7s ease-out;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
      font-size: 22px;
      font-weight: 400;
      fill: #9a948a;
      letter-spacing: 0.3px;
      animation: fadeUp 2s ease-out;
    }
    .accent {
      stroke: #c83a4a;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 200;
      animation: drawLine 1.5s ease-out forwards, pulse 3s ease-in-out 1.5s infinite;
    }
  </style>
  <rect width="1200" height="320" fill="url(#bg)" rx="14"/>
  <!-- English wordmark on the left -->
  <text x="80" y="148" class="title">Waraq</text>
  <line x1="86" y1="176" x2="300" y2="176" class="accent"/>
  <!-- Arabic wordmark on the right, balanced against the English -->
  <text x="1040" y="150" class="arabic" text-anchor="middle">ورق</text>
  <!-- Dictionary gloss + tagline -->
  <text x="80" y="222" class="define">waraq · noun · Arabic — paper; leaves; sheets (as in ورق الجدران, “wallpaper”)</text>
  <text x="80" y="260" class="tagline">Live animated wallpapers for macOS. Free. Forever.</text>
</svg>
